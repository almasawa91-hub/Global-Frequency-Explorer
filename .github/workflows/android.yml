name: Offline Frequency & FM Explorer Android
on:
  push:
    branches: [main, master, offline-fm-explorer]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create . --platforms=android --org com.offlinefrequency
      - name: Set Android compile SDK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          files = [p for p in candidates if p.exists()]
          if not files:
              raise SystemExit("Could not find Android app Gradle build file")
          for path in files:
              text = path.read_text()
              lines = text.splitlines()
              changed = False
              for i, line in enumerate(lines):
                  stripped = line.strip()
                  if stripped.startswith("compileSdk") and ("flutter.compileSdkVersion" in stripped or "compileSdkVersion" in stripped or "compileSdk =" in stripped):
                      indent = line[:len(line) - len(line.lstrip())]
                      if path.suffix == ".kts":
                          lines[i] = indent + "compileSdk = 36"
                      else:
                          lines[i] = indent + "compileSdkVersion 36"
                      changed = True
                      break
              if not changed:
                  raise SystemExit(f"Could not find compileSdk declaration in {path}")
              path.write_text("\\n".join(lines) + "\\n")
              print(f"Updated {path}:")
              for line in lines:
                  if line.strip().startswith("compileSdk"):
                      print(line)
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-frequency-fm-explorer-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
